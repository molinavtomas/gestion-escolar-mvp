services:
  - type: web
    name: gestion-escolar-mvp
    runtime: docker
    plan: starter # pago (US$7/mes): no se duerme, el link abre al instante
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # true = carga datos de ejemplo (para la demo). Con datos reales: false + Seed__DirectorDni
      - key: Seed__DemoData
        value: "true"
      - key: Seed__DirectorDni
        sync: false
